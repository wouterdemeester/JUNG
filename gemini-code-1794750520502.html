<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>De Maker & Merken Test - Welk Archetype ben jij?</title>
    <style>
        :root {
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --primary-color: #f39c12;
            --text-color: #f5f5f5;
            --text-muted: #aaaaaa;
            --hover-color: #2a2a2a;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: var(--surface-color);
            max-width: 600px;
            width: 100%;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        p {
            color: var(--text-muted);
            line-height: 1.6;
        }

        .btn {
            background-color: var(--primary-color);
            color: #121212;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
            margin-top: 20px;
        }

        .btn:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }

        .hidden {
            display: none !important;
        }

        .fade-in {
            animation: fadeIn 0.4s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .progress-bar {
            height: 4px;
            background-color: #333;
            width: 100%;
            margin-bottom: 30px;
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background-color: var(--primary-color);
            width: 0%;
            transition: width 0.3s ease;
        }

        .question-text {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 25px;
            text-align: left;
        }

        .option {
            background-color: #252525;
            border: 1px solid #333;
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 12px;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 15px;
        }

        .option:hover {
            background-color: var(--hover-color);
            border-color: var(--primary-color);
        }

        .result-title {
            color: var(--primary-color);
            font-size: 28px;
            margin-bottom: 15px;
        }
        
        .result-archetypes {
            background-color: #252525;
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
            text-align: left;
        }

        .result-archetypes li {
            margin-bottom: 10px;
            color: var(--text-color);
        }
    </style>
</head>
<body>

    <div class="container" id="app">
        <!-- Startscherm -->
        <div id="start-screen" class="fade-in">
            <h1>De Maker & Merken Test</h1>
            <p>Welk Jungiaans archetype stuurt jouw creatieve proces en storytelling? Ontdek in 5 snelle vragen jouw primaire profiel.</p>
            <button class="btn" onclick="startQuiz()">Start de test</button>
        </div>

        <!-- Quiz Scherm -->
        <div id="quiz-screen" class="hidden">
            <div class="progress-bar">
                <div class="progress-fill" id="progress"></div>
            </div>
            <div class="question-text" id="question-text">Vraag komt hier...</div>
            <div id="options-container">
                <!-- Knoppen worden dynamisch geladen -->
            </div>
        </div>

        <!-- Resultaat Scherm -->
        <div id="result-screen" class="hidden fade-in">
            <h2 class="result-title" id="result-title">Jouw Archetype Groep</h2>
            <p id="result-desc">Uitleg komt hier...</p>
            <div class="result-archetypes">
                <strong>Jouw specifieke archetypes binnen deze groep:</strong>
                <ul id="result-list"></ul>
            </div>
            <button class="btn" onclick="location.reload()">Opnieuw proberen</button>
        </div>
    </div>

    <script>
        const questions = [
            {
                q: "Bij de start van een nieuw creatief project (script, design, video), wat is je eerste instinct?",
                options: [
                    { text: "Meteen structuur brengen. Mapjes aanmaken, een moodboard bouwen en zorgen dat alles strak zit.", type: "A" },
                    { text: "Onderzoeken. Je duikt de diepte in, zoekt naar theorieën of nieuwe inspiratiebronnen.", type: "B" },
                    { text: "Kijken hoe dit het publiek gaat raken. Je wil weten voor wie je het maakt en connectie zoeken.", type: "C" },
                    { text: "Iets disruptiefs bedenken. Je zoekt meteen naar de hoek waarmee je grenzen kan verleggen.", type: "D" }
                ]
            },
            {
                q: "Jouw rol in een productie- of designteam is meestal...",
                options: [
                    { text: "De organisator/ontwerper die zorgt dat de visie perfect en geordend wordt uitgevoerd.", type: "A" },
                    { text: "De denker of visionair die met de slimste inzichten en abstracte ideeën komt.", type: "B" },
                    { text: "De sfeermaker of bemiddelaar die zorgt dat het project écht menselijk en toegankelijk voelt.", type: "C" },
                    { text: "De drijvende kracht die de lat hoog legt, obstakels wegramt en veilige paden vermijdt.", type: "D" }
                ]
            },
            {
                q: "Wat is jouw grootste ergernis tijdens het uitwerken van een verhaal of montage?",
                options: [
                    { text: "Chaos, rommelige tijdlijnen/bestanden en een slordige, ongecontroleerde afwerking.", type: "A" },
                    { text: "Oppervlakkigheid, het gebruik van clichés of te weinig vrijheid krijgen.", type: "B" },
                    { text: "Een ontwerp of script dat koud en afstandelijk is, of elitair overkomt op de kijker.", type: "C" },
                    { text: "Middelmatigheid. Gewoon de briefing braaf afvinken zonder enige vorm van magie of lef.", type: "D" }
                ]
            },
            {
                q: "Als je werk af is, wat is dan het mooiste compliment?",
                options: [
                    { text: "'Wauw, dit zit zo ongelofelijk mooi, logisch en professioneel in elkaar.'", type: "A" },
                    { text: "'Dit heeft me echt aan het denken gezet, wat een ijzersterk en diepgaand inzicht.'", type: "B" },
                    { text: "'Dit is zó herkenbaar en leuk, ik voelde me meteen aangesproken als kijker.'", type: "C" },
                    { text: "'Dit blies me omver, het is compleet anders dan wat de rest heeft gedaan.'", type: "D" }
                ]
            },
            {
                q: "Kies de mindset die het best bij jouw werkethiek past:",
                options: [
                    { text: "If you want it done right, design it yourself. (Orde & Perfectie)", type: "A" },
                    { text: "The truth is out there, go explore. (Vrijheid & Waarheid)", type: "B" },
                    { text: "All you need is a good team and audience connection. (Samen & Herkenbaar)", type: "C" },
                    { text: "Rules are made to be broken. (Impact & Kracht)", type: "D" }
                ]
            }
        ];

        const results = {
            "A": {
                title: "De Structuurbouwers (Focus op Orde & Vorm)",
                desc: "Jij brengt orde in de chaos. In jouw storytelling of designs geloof je dat een strak proces en heldere kaders het verhaal sterker maken. Perfect voor het creëren van geloofwaardige, stabiele werelden.",
                list: [
                    "<strong>De Schepper (Creator):</strong> Streeft naar esthetische perfectie en vernieuwing door vorm. (Bv. Apple)",
                    "<strong>De Heerser (Ruler):</strong> Bewaakt overzicht, kwaliteit en stabiliteit. (Bv. Rolex)",
                    "<strong>De Zorgverlener (Caregiver):</strong> Ontwerpt vanuit empathie, veiligheid en dienstbaarheid. (Bv. Volvo)"
                ]
            },
            "B": {
                title: "De Ontdekkingsreizigers (Focus op Waarheid & Kennis)",
                desc: "Jij wil de wereld begrijpen. In je creatieve werk zoek je naar theorie, onafhankelijkheid en de essentie. Je personages of ontwerpen zijn vaak gelaagd en filosofisch.",
                list: [
                    "<strong>De Wijze (Sage):</strong> Zoekt de waarheid en deelt kennis, analytisch en fact-based. (Bv. Google)",
                    "<strong>De Ontdekker (Explorer):</strong> Verlegt grenzen en zoekt nieuwe horizonten, vrij van regels. (Bv. The North Face)",
                    "<strong>De Onschuldige (Innocent):</strong> Zoekt naar puurheid, eenvoud en eerlijkheid. (Bv. Dove)"
                ]
            },
            "C": {
                title: "De Verbinders (Focus op Sociaal & Connectie)",
                desc: "Jij maakt werk voor de mensen. Je verhalen en video's moeten herkenbaar zijn, verbinden of entertainen. Jouw werk haalt de muur tussen de maker en de kijker naar beneden.",
                list: [
                    "<strong>De Gewone Man (Everyman):</strong> No-nonsense, toegankelijk en wars van pretentie. (Bv. IKEA)",
                    "<strong>De Minnaar (Lover):</strong> Ontwerpt voor schoonheid, passie en zintuiglijke verleiding. (Bv. Chanel)",
                    "<strong>De Nar (Jester):</strong> Gebruikt humor, speelsheid en entertainment om drempels te verlagen. (Bv. Ben & Jerry's)"
                ]
            },
            "D": {
                title: "De Veranderaars (Focus op Impact & Disruptie)",
                desc: "Jij daagt de status quo uit. Je neemt risico's om iets onvergetelijks te maken. Jouw verhalen draaien om conflict, transformatie en het weigeren van middelmatigheid.",
                list: [
                    "<strong>De Held (Hero):</strong> Wil bewijzen wat mogelijk is door hard te werken en obstakels te overwinnen. (Bv. Nike)",
                    "<strong>De Magiër (Magician):</strong> Combineert visie (en techniek) om magische transformaties te creëren. (Bv. Disney)",
                    "<strong>De Rebel (Outlaw):</strong> Breekt bewust de regels om te innoveren. Disruptie is je wapen. (Bv. Diesel)"
                ]
            }
        };

        let currentQuestion = 0;
        let scores = { A: 0, B: 0, C: 0, D: 0 };

        function startQuiz() {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            document.getElementById('quiz-screen').classList.add('fade-in');
            showQuestion();
        }

        function showQuestion() {
            const q = questions[currentQuestion];
            document.getElementById('question-text').innerText = (currentQuestion + 1) + ". " + q.q;
            
            // Update progress bar
            const progress = ((currentQuestion) / questions.length) * 100;
            document.getElementById('progress').style.width = progress + '%';

            const container = document.getElementById('options-container');
            container.innerHTML = ''; // Clear previous

            q.options.forEach(opt => {
                const btn = document.createElement('div');
                btn.className = 'option fade-in';
                btn.innerText = opt.text;
                btn.onclick = () => selectOption(opt.type);
                container.appendChild(btn);
            });
        }

        function selectOption(type) {
            scores[type]++;
            currentQuestion++;

            if (currentQuestion < questions.length) {
                // Korte delay zodat de klik geregistreerd voelt voor de gebruiker
                setTimeout(showQuestion, 150);
            } else {
                setTimeout(showResult, 150);
            }
        }

        function showResult() {
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            
            // Bepaal de hoogste score
            let highestType = 'A';
            let maxScore = scores['A'];

            for (const type in scores) {
                if (scores[type] > maxScore) {
                    highestType = type;
                    maxScore = scores[type];
                }
            }

            const result = results[highestType];
            document.getElementById('result-title').innerText = result.title;
            document.getElementById('result-desc').innerText = result.desc;
            
            const listContainer = document.getElementById('result-list');
            listContainer.innerHTML = '';
            result.list.forEach(item => {
                const li = document.createElement('li');
                li.innerHTML = item;
                listContainer.appendChild(li);
            });
        }
    </script>
</body>
</html>
